name: Build iOS IPA

# Gallery iOS 客户端（Flutter）。代码在 app/，只有 ios 分支有这个目录，
# 所以可以手动选分支跑，也可以直接从 ios 分支 push 触发。
# master 上的 build-arm64-image.yml 是服务器镜像构建，跟这里互不影响。

on:
  push:
    branches: [ios]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Gallery iOS (unsigned IPA)
    runs-on: macos-15
    timeout-minutes: 90

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 显式回到仓库根，才能在 app/ 缺失时给出人话而不是「工作目录不存在」。
      - name: Guard app directory
        working-directory: .
        run: |
          set -e
          test -f app/pubspec.yaml || {
            echo "::error::当前分支没有 app/pubspec.yaml，请到 Actions 里把分支选成 ios"
            exit 1
          }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Toolchain
        run: |
          set -e
          flutter --version | sed -n '1,3p'
          xcodebuild -version | sed -n '1p'
          xcode-select -p

      # Podfile.lock 不入库，但 CocoaPods 版本差异会让 CI 随机换依赖。
      - name: Use CocoaPods (SwiftPM off)
        run: flutter config --no-enable-swift-package-manager || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 连局域网盒子必须是明文 http + 本地网络授权，这两项少了就是白屏。
      - name: Check Info.plist
        run: |
          set -e
          python3 - <<'PY'
          import plistlib, sys
          with open('ios/Runner/Info.plist', 'rb') as f:
              info = plistlib.load(f)
          ats = info.get('NSAppTransportSecurity') or {}
          problems = []
          if not ats.get('NSAllowsArbitraryLoads'):
              problems.append('NSAppTransportSecurity.NSAllowsArbitraryLoads 不是 true')
          if not info.get('NSLocalNetworkUsageDescription'):
              problems.append('缺 NSLocalNetworkUsageDescription')
          if problems:
              for p in problems:
                  print('::error::' + p)
              sys.exit(1)
          print('Info.plist OK: display name =', info.get('CFBundleDisplayName'))
          PY

      - name: Ensure iOS deployment target >= 15.0
        run: |
          set -e
          python3 - <<'PY'
          import glob, os, re
          MIN = 15.0
          pod = 'ios/Podfile'
          if os.path.exists(pod):
              s = open(pod).read()
              if re.search(r"^\s*platform :ios,", s, re.M):
                  s = re.sub(r"^\s*platform :ios,\s*'[0-9.]+'",
                             "platform :ios, '15.0'", s, flags=re.M)
              else:
                  s = "platform :ios, '15.0'\n" + s
              open(pod, 'w').write(s)
          def bump(m):
              return 'IPHONEOS_DEPLOYMENT_TARGET = %.1f;' % max(float(m.group(1)), MIN)
          for p in glob.glob('ios/Runner.xcodeproj/project.pbxproj'):
              s = open(p).read()
              open(p, 'w').write(re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = ([0-9.]+);', bump, s))
          PY

      # 生成 ios/Flutter/Generated.xcconfig 等，绕开 Flutter 自己的 Team 校验。
      - name: Prepare Flutter iOS config
        run: flutter build ios --release --config-only --no-codesign

      - name: CocoaPods install
        run: cd ios && pod install

      # flutter build ipa 会强制要求签名 Team，直接 xcodebuild 出未签名包。
      - name: Xcode build (unsigned)
        run: |
          set -e
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        id: pkg
        run: |
          set -e
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | tr -d '\r')
          IPA="gallery-${V%%+*}.ipa"
          # 用 sed 取首行：head 提前关管道会让 xcodebuild 收到 SIGPIPE。
          APP_PATH=$(find build/ios -type d -name Runner.app | sed -n '1p')
          test -n "$APP_PATH" && test -d "$APP_PATH"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr "$IPA" Payload
          rm -rf Payload
          ls -lh "$IPA"
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallery-ios-ipa
          path: app/${{ steps.pkg.outputs.ipa }}
          if-no-files-found: error
          # Release 上已经有一份长期的，artifact 只是给本次 run 兜底，别占账号配额。
          retention-days: 14

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V="${{ steps.pkg.outputs.version }}"
          TAG="ios-$(echo "$V" | tr '+' '-')"
          FILE="app/${{ steps.pkg.outputs.ipa }}"
          TITLE="Gallery iOS $V"
          cd "$GITHUB_WORKSPACE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
            gh release edit "$TAG" --title "$TITLE" --latest
          else
            gh release create "$TAG" "$FILE" \
              --title "$TITLE" \
              --notes "未签名 IPA，自行用 Sideloadly / AltStore 签名安装。commit ${{ github.sha }} / run #${{ github.run_number }}" \
              --latest
          fi
          echo "https://github.com/${{ github.repository }}/releases/tag/$TAG"
