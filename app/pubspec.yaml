name: gallery_ios
description: Gallery - PiGallery2 iOS 客户端
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0
  provider: ^6.1.5
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  flutter_cache_manager: ^3.4.5
  path: ^1.9.1
  intl: ^0.20.3
  photo_view: ^0.15.0
  video_player: ^2.14.1
  # 2.12.2 起改用 Xcode 26 SDK 才有的 AVAsynchronousKeyValueLoading.load(...isolation:)，
  # VM 上的 Xcode 16.4 编不过；2.12.1 是最后一个 16.x 可编译版本，别顺手升。
  video_player_avfoundation: 2.12.1

dev_dependencies:
  flutter_lints: ^6.0.0
  # 只给 tool/make_icons.dart 切图标用，不进包体。
  image: ^4.5.4

flutter:
  uses-material-design: true
